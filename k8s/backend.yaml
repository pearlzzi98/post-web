apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  REDIS_URL: "redis://redis:6379"
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  SUPABASE_BUCKET: "post-web-files"
---
# Secret은 별도로 kubectl create secret으로 생성
# kubectl create secret generic backend-secret \
#   --from-literal=DATABASE_URL=... \
#   --from-literal=SECRET_KEY=... \
#   --from-literal=NEXT_PUBLIC_SUPABASE_URL=... \
#   --from-literal=NEXT_PUBLIC_SUPABASE_ANON_KEY=... \
#   --from-literal=SUPABASE_SERVICE_ROLE_KEY=...
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        version: v1
    spec:
      containers:
        - name: backend
          image: post-web-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
