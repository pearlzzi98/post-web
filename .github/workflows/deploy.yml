name: Test & Deploy

on:
  push:
    branches:
      - master
      - dev

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: backend
        run: uv sync

      - name: Run pytest
        working-directory: backend
        run: uv run pytest tests/ -v

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Deploy via SSH (dev)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /module/dev/workspace/post-web
            git pull origin dev
            docker compose -f docker-compose.yml -f docker-compose.dev.yml -p dev up -d --build
            docker compose -p dev ps

  health-check:
    name: Health Check (dev)
    runs-on: ubuntu-latest
    needs: deploy-dev

    steps:
      - name: Check dev server health
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "서비스 기동 대기 중..."
            sleep 15
            curl -f http://localhost:8999/health || exit 1
            curl -f http://localhost:3999/ || exit 1
            echo "Health check 통과!"

  promote-to-prod:
    name: Promote dev → master
    runs-on: ubuntu-latest
    needs: health-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge dev into master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout master
          git merge origin/dev --no-ff -m "chore: dev → master 자동 머지 (health check 통과)"
          git push origin master

  deploy-prod:
    name: Deploy to Prod (kind)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Deploy via SSH (prod)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /module/prod/workspace/post-web
            git pull origin master

            # Docker 이미지 빌드
            docker build -t post-web-backend:latest ./backend
            docker build -t post-web-frontend:latest ./frontend

            # kind 클러스터에 이미지 로드
            kind load docker-image post-web-backend:latest --name post-web
            kind load docker-image post-web-frontend:latest --name post-web

            # k8s 매니페스트 적용
            kubectl apply -f k8s/

            # 롤링 재시작 (새 이미지 반영)
            kubectl rollout restart deployment/backend
            kubectl rollout restart deployment/frontend

            # 배포 완료 대기
            kubectl rollout status deployment/backend --timeout=120s
            kubectl rollout status deployment/frontend --timeout=120s

            # 상태 확인
            kubectl get pods
